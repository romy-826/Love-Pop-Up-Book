<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#34251c"><meta name="description" content="翻开绿色丝绒纪念册，让回忆在纸页间慢慢生长。"><title>缠绕 · 我们的纪念册</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="art.css"></head>
<body>
<svg width="0" height="0" aria-hidden="true" class="svg-defs"><defs><filter id="paperNoise"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><linearGradient id="silk" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8c6c46"/><stop offset=".24" stop-color="#e6cfad"/><stop offset=".48" stop-color="#fff0d7"/><stop offset=".7" stop-color="#cfac81"/><stop offset="1" stop-color="#f7dfbc"/></linearGradient></defs></svg>
<svg class="svg-defs" width="0" height="0" aria-hidden="true"><defs><clipPath id="heartCut" clipPathUnits="objectBoundingBox"><path d="M.5 .14 C.30 -.1 .02 -.01 .01 .27 C-.02 .51 .26 .78 .5 .99 C.76 .77 1.02 .51 .99 .27 C.98 -.01 .70 -.1 .5 .14Z"/></clipPath></defs></svg>
<header class="art-toolbar"><span class="art-wordmark">缠绕</span><div><button id="fitBtn" class="quiet" aria-pressed="false">放大细节</button><button id="editBtn" class="quiet">✎ 写下我们的故事</button></div></header>
<main id="artScene" aria-label="我们的纪念册"><div id="artWrap"><canvas id="artCanvas" width="1672" height="941" aria-hidden="true"></canvas><div id="artLayers"></div><button id="openBook" class="cover-hit" aria-label="翻开纪念册"></button><div id="pageTransition" aria-hidden="true"></div></div></main>
<footer class="art-nav" id="readerNav" hidden><button id="prevBtn" aria-label="上一页">‹</button><div><span id="chapterName"></span><small id="pageCount"></small></div><button id="nextBtn" aria-label="下一页">›</button><button id="closeBtn">合上书本</button></footer>
<p id="pageHint" class="art-hint" hidden></p>
<dialog id="editor"><form id="editorForm"><div class="drawer-title"><h2>把故事写成你们的</h2><button type="button" class="icon-btn" id="dismissEditor" aria-label="关闭编辑">×</button></div><p class="muted">内容保存在当前浏览器。换设备前，可以导出一份备份。</p><div class="field-pair"><label>你的名字<input name="name1" maxlength="12" placeholder="xx"></label><label>另一个名字<input name="name2" maxlength="12" placeholder="xx"></label></div><label>纪念主题<input name="occasion" maxlength="24" placeholder="相恋一周年"></label><label>纪念日期<input name="date" type="date" required></label><label>写给彼此的信<textarea name="letter" rows="5" maxlength="4000" placeholder="等待你来书写"></textarea></label><label>爱心相框下的文字<textarea name="memoryNote" rows="4" maxlength="700" placeholder="写下这一页的心情"></textarea></label><label>信件字体<input id="fontInput" type="file" accept=".woff,.woff2,.ttf,.otf"><small>可导入你拥有使用权的千玺手写体文件；默认使用楷体。</small></label><h3>把回忆放进相框</h3><div id="photoEditor"></div><p id="saveError" role="alert"></p><button type="submit" class="primary">保存到纪念册</button><button type="button" class="primary publish-export" id="publishExport">导出发布内容</button><div class="backup-actions"><button type="button" id="exportBtn">导出备份</button><button type="button" id="importBtn">导入备份</button><input id="importInput" type="file" accept="application/json,.json" hidden></div></form></dialog>
<dialog id="letterDialog"><button class="icon-btn" id="dismissLetter" aria-label="收起信件">×</button><small>一封写给你的信</small><div id="letterText" class="handwritten"></div><button id="writeLetter" class="text-btn">✎ 继续书写</button></dialog>
<div id="toast" role="status" aria-live="polite"></div><script src="art.js"></script>
</body></html>
